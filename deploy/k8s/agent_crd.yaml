apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: neuralagents.neuralcore.ai
spec:
  group: neuralcore.ai
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                role:
                  type: string
                boundedContext:
                  type: string
                  enum: ["persistence", "orchestration", "retrieval", "evolution"]
                capabilities:
                  type: array
                  items:
                    type: string
                resourceLimit:
                  type: string
            status:
              type: object
              properties:
                state:
                  type: string
                consensusStatus:
                  type: string
  scope: Namespaced
  names:
    plural: neuralagents
    singular: neuralagent
    kind: NeuralAgent
    shortNames:
    - na
