apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: neuralswarms.neuralcore.ai
spec:
  group: neuralcore.ai
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                context:
                  type: string
                  description: "The DDD Bounded Context this swarm belongs to."
                  enum: ["persistence", "orchestration", "retrieval", "evolution"]
                replicas:
                  type: integer
                  minimum: 1
                neuroSemanticConfig:
                  type: object
                  properties:
                    modelVariant:
                      type: string
                      default: "all-MiniLM-L6-v2"
                    embeddingDim:
                      type: integer
                      default: 768
                isolationLevel:
                  type: string
                  default: "pod"
            status:
              type: object
              properties:
                activeAgents:
                  type: integer
                epistemicHealth:
                  type: string
  scope: Namespaced
  names:
    plural: neuralswarms
    singular: neuralswarm
    kind: NeuralSwarm
    shortNames:
      - ns
