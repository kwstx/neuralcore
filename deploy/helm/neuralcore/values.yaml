# NeuralCore Production Configuration

replicaCount: 3

image:
  repository: kwstx/neuralcore
  pullPolicy: IfNotPresent
  tag: "latest"

# Predictive Auto-scaling Configuration
scaling:
  method: "bandit"
  minReplicas: 3
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  epistemicLoadForecasting:
    enabled: true
    samplingInterval: "1m"

# Cost Optimization & Model Routing
costOptimization:
  enabled: true
  mabRouter:
    strategy: "thompson_sampling"
    explorationFactor: 0.1
  speculativeDecoding:
    enabled: true
    draftModel: "gpt-4o-mini"
    targetModel: "gpt-4o"
  contextCompression:
    enabled: true
    targetRatio: 0.4

# Zero-Trust Security Fabric
security:
  enclave:
    enabled: true
    provider: "aws-nitro"
  vault:
    address: "http://vault.security:8200"

# Agent Marketplace (GitOps Modules)
marketplace:
  enabled: true
  gitopsRepo: "git@github.com:kwstx/neuralcore-agent-packs.git"
  shaclValidation:
    enabled: true
    strictMode: true

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Prometheus Metrics for Epistemic Entropy
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
