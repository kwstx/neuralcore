name: Production CI & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK (for TLA+)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install TLA+ Tools
        run: |
          mkdir -p bin
          curl -L https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar -o bin/tla2tools.jar

      - name: Run TLA+ Model Checker (TLC)
        run: |
          # Verify core substrate invariants
          java -cp bin/tla2tools.jar tlc2.TLC verification/tla/NeuroSemanticFabric.tla -workers auto -deadlock

  chaos-engineering:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Chaos Mesh Experiments
        run: |
          # Simulated Chaos Engineering involving pod failure, network latency, and clock skew
          echo "Injecting network latency into NATS cluster..."
          # chaos-mesh-cli run network-delay --duration 5m
          echo "Verifying epistemic consistency under partition..."
          python -m pytest tests/chaos/test_consistency.py

  build-and-package:
    runs-on: ubuntu-latest
    needs: chaos-engineering
    steps:
      - uses: actions/checkout@v4

      - name: Lint Helm Chart
        run: helm lint deploy/helm/neuralcore

      - name: Package Helm Chart
        run: helm package deploy/helm/neuralcore

      - name: Validate Agent Marketplace Modules (SHACL)
        run: |
          python -m pip install pyshacl rdflib
          python libs/marketplace/validator.py --check-all
