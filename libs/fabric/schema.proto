syntax = "proto3";

package neuralcore.fabric;

message FabricEvent {
  // Metadata & Routing
  string event_id = 1;
  string correlation_id = 2;
  string source_agent_id = 3;
  int64 timestamp = 4;

  // Neuro-Semantic Header
  // 768-dimensional knowledge graph embedding vector
  repeated float semantic_embedding = 5;

  // Payload
  bytes payload = 6;
  string payload_type = 7; // e.g., "json", "protobuf.MessageType"

  // Causal Context
  repeated string causal_predecessors = 8; // event_ids that enabled this event
}

message KnowledgeTriple {
  string subject = 1;
  string predicate = 2;
  string object = 3;
  float confidence = 4;
}
